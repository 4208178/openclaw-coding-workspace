<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sun" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#sun)"/>
  <!-- Sun rays -->
  <g fill="#fff" opacity="0.9">
    <rect x="246" y="40" width="20" height="60" rx="10"/>
    <rect x="246" y="412" width="20" height="60" rx="10"/>
    <rect x="40" y="246" width="60" height="20" rx="10"/>
    <rect x="412" y="246" width="60" height="20" rx="10"/>
    <rect x="100" y="100" width="20" height="50" rx="10" transform="rotate(45 110 125)"/>
    <rect x="392" y="100" width="20" height="50" rx="10" transform="rotate(-45 402 125)"/>
    <rect x="100" y="362" width="20" height="50" rx="10" transform="rotate(-45 110 387)"/>
    <rect x="392" y="362" width="20" height="50" rx="10" transform="rotate(45 402 387)"/>
  </g>
  <!-- Sun center -->
  <circle cx="256" cy="256" r="120" fill="#fff"/>
  <!-- Coffee cup -->
  <path d="M200 280 h80 a30 30 0 0 1 30 30 v60 a10 10 0 0 1 -10 10 h-120 a10 10 0 0 1 -10 -10 v-60 a30 30 0 0 1 30 -30" fill="#78350f"/>
  <path d="M310 300 h20 a15 15 0 0 1 0 30 h-20" stroke="#78350f" stroke-width="8" fill="none"/>
  <!-- Steam -->
  <g stroke="#fbbf24" stroke-width="6" fill="none" stroke-linecap="round">
    <path d="M230 250 q10 -15 0 -30"/>
    <path d="M256 245 q10 -15 0 -30"/>
    <path d="M282 250 q10 -15 0 -30"/>
  </g>
</svg>
